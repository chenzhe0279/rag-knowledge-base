[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "czzgods", email = "3302076969@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "cos-python-sdk-v5>=1.9.44",
    "docling>=2.140.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "jieba==0.42.1",
    "langchain>=1.4.6",
    "langchain-community<0.4.2",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "langsmith>=0.8.3",
    "pgvector>=0.5.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "ragas>=0.4.3",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.38.0",
]

[project.scripts]
app = "app.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

# uv_build 默认按 src-layout 找 src/backend/__init__.py（那套脚手架已删除），
# 这里显式指定真实布局：模块在项目根目录下的 app/ 里
[tool.uv.build-backend]
module-name = "app"
module-root = ""
